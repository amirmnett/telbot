<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی اپ من</title>
    <!-- اتصال به کتابخانه رسمی تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            text-align: center; 
            padding: 20px; 
            /* استفاده از رنگ‌های تم خود کاربر در تلگرام */
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            background-color: var(--tg-theme-button-color, #3390ec); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            border: none; border-radius: 8px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>خوش آمدید!</h2>
    <p id="user-info">در حال دریافت اطلاعات...</p>
    <button onclick="closeApp()">بستن مینی اپ</button>

    <script>
        // اطمینان از بارگذاری کامل صفحه قبل از اجرای اسکریپت
        document.addEventListener("DOMContentLoaded", function() {
            const tg = window.Telegram.WebApp;
            
            // این متد برای دریافت صحیح اطلاعات از تلگرام الزامی است
            tg.ready(); 
            
            // باز شدن اپ در حالت تمام صفحه
            tg.expand(); 

            // بررسی و نمایش اطلاعات کاربر تلگرام
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                // دریافت نام کاربر (در صورت نبود نام، از کلمه "کاربر" استفاده می‌شود)
                const firstName = tg.initDataUnsafe.user.first_name || "کاربر";
                document.getElementById('user-info').innerText = "سلام " + firstName + " عزیز!";
            } else {
                document.getElementById('user-info').innerText = "اطلاعات کاربر یافت نشد.";
            }
        });

        // تابع بستن اپ
        function closeApp() {
            window.Telegram.WebApp.close();
        }
    </script>
</body>
</html>
